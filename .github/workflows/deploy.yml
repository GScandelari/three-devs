name: Deploy to Firebase

# Todo o deploy passa por aqui: ninguém precisa publicar nada à mão.
# - PR: valida regras, índices e functions sem publicar (--dry-run) e publica
#   o site num canal de preview. Erros de build, configuração ou permissão
#   aparecem na PR, antes do merge.
# - Push na main: publica, nesta ordem, regras/índices do Firestore, Cloud
#   Functions e o site. Se uma etapa falhar, as seguintes não rodam: o site
#   novo nunca vai ao ar antes do servidor de que ele depende.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    # PRs de forks não recebem os secrets do repositório.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Dois merges seguidos não publicam em paralelo; o segundo espera o primeiro.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('deploy-pr-{0}', github.event.pull_request.number) || 'deploy-production' }}
      cancel-in-progress: false
    # A action de hosting registra um check e comenta a URL do preview na PR.
    permissions:
      contents: read
      checks: write
      pull-requests: write
    env:
      FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - run: npm ci

      - run: npm ci --prefix functions

      - run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

      - name: Testes das functions
        run: npm test --prefix functions

      # Parâmetros das functions (não são segredos): vêm das variáveis do
      # repositório (Settings → Secrets and variables → Actions → Variables).
      # A RESEND_API_KEY continua no Secret Manager do Google Cloud.
      - name: Gerar functions/.env do projeto
        env:
          CONTRACT_EMAIL_FROM: ${{ vars.CONTRACT_EMAIL_FROM }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$CONTRACT_EMAIL_FROM" ] || [ -z "$APP_URL" ]; then
            echo "::error::Defina as variáveis CONTRACT_EMAIL_FROM e APP_URL do repositório (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
          {
            printf 'CONTRACT_EMAIL_FROM="%s"\n' "$CONTRACT_EMAIL_FROM"
            printf 'APP_URL=%s\n' "$APP_URL"
          } > "functions/.env.$FIREBASE_PROJECT"

      # A CLI do package.json (versão fixada) autentica com a mesma conta de
      # serviço usada no hosting. O arquivo fica fora do repositório.
      - name: Credenciais da conta de serviço
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/service-account.json" >> "$GITHUB_ENV"

      - name: Validar regras, índices e functions (PR, sem publicar)
        if: github.event_name == 'pull_request'
        run: npx firebase deploy --only firestore,functions --project "$FIREBASE_PROJECT" --non-interactive --dry-run

      # --force: o repositório é a fonte da verdade. Functions removidas do
      # código e índices fora do firestore.indexes.json são apagados.
      - name: Publicar regras, índices e functions
        if: github.event_name != 'pull_request'
        run: npx firebase deploy --only firestore,functions --project "$FIREBASE_PROJECT" --non-interactive --force

      # Sem isto a action roda firebase-tools@latest, e uma versão nova da CLI
      # pode quebrar o deploy sem nenhuma mudança no repositório. A versão vem
      # do package.json, a mesma usada nas etapas acima.
      - id: firebase-tools
        run: echo "version=$(node -p "require('./package.json').devDependencies['firebase-tools']")" >> "$GITHUB_OUTPUT"

      - name: Deploy de preview do site (PR)
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          firebaseToolsVersion: ${{ steps.firebase-tools.outputs.version }}
          expires: 3d

      - name: Publicar o site
        if: github.event_name != 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          firebaseToolsVersion: ${{ steps.firebase-tools.outputs.version }}

      - name: Remover credenciais
        if: always()
        run: rm -f "$RUNNER_TEMP/service-account.json"
