name: Testar regras do Firestore

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-rules:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      # --ignore-scripts: os testes não dependem de scripts de instalação dos pacotes.
      - run: npm ci --ignore-scripts

      - run: npm run test:rules
